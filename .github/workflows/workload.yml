# Layer 3 Workloads: Deploy World Generation Jobs and Coordinator on EKS
# Runs on-demand via GitHub Actions OIDC to bypass local laptop and CloudShell constraints.

name: "EKS — Run Batch Worldgen Jobs"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform on EKS cluster"
        required: true
        type: choice
        default: "apply"
        options:
          - apply
          - status
          - logs
          - delete_jobs

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  CLUSTER_NAME: football-life-eks

jobs:
  run-workloads:
    name: "Run Worldgen Workloads on EKS"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Connect to EKS Cluster
        run: |
          echo "Configuring kubeconfig for cluster ${{ env.CLUSTER_NAME }}..."
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}
          kubectl get nodes -o wide

      - name: Resolve ECR Image URI
        id: resolve-ecr
        run: |
          ECR_IMAGE=$(aws secretsmanager get-secret-value --secret-id football-life/ecr-image-url --query SecretString --output text --region ${{ env.AWS_REGION }}):latest
          echo "IMAGE_URI=${ECR_IMAGE}" >> $GITHUB_ENV
          echo "Resolved ECR worker image: ${ECR_IMAGE}"

      - name: Deploy Coordinator & Stage 1 Jobs
        if: inputs.action == 'apply'
        run: |
          echo "Ensuring 'worldgen' namespace exists..."
          kubectl create namespace worldgen --dry-run=client -o yaml | kubectl apply -f -

          # Clear any old job or stuck pods that had invalid image name / inflated requests
          kubectl delete job worldgen-stage1 -n worldgen --ignore-not-found
          kubectl delete pod -n worldgen -l app=worldgen-coordinator --field-selector=status.phase!=Running --ignore-not-found || true

          echo "Deploying Stage 1 Indexed Job (creates ServiceAccount & 10 World Workers)..."
          sed "s|ECR_IMAGE_PLACEHOLDER|${IMAGE_URI}|g" k8s/worldgen/stage1.yaml | kubectl apply -f -

          echo "Deploying Coordinator Deployment & NLB Service..."
          sed "s|ECR_IMAGE_PLACEHOLDER|${IMAGE_URI}|g" k8s/worldgen/coordinator.yaml | kubectl apply -f -

          echo "Waiting 30s for pods to schedule, pull image, and begin simulation..."
          sleep 30

      - name: Delete Jobs (if requested)
        if: inputs.action == 'delete_jobs'
        run: |
          kubectl delete job worldgen-stage1 -n worldgen --ignore-not-found
          kubectl delete job worldgen-stage2 -n worldgen --ignore-not-found

      - name: Capture Cluster & Workload Status
        run: |
          echo "### :whale: EKS Nodes & Cluster Health" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl get nodes -o wide >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### :gear: Batch Jobs & Pod Status (namespace: worldgen)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl get jobs,pods -n worldgen -o wide >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### :clipboard: Job Details & Events" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl describe job worldgen-stage1 -n worldgen >> $GITHUB_STEP_SUMMARY 2>&1 || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### :satellite: Services & Load Balancers" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n worldgen >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### :package: S3 Bucket Contents (templates & worlds)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          aws s3 ls s3://football-life-templates-ap-south-1/ --recursive >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Empty or cannot list" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### :card_index: DynamoDB Catalog Scan" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          aws dynamodb scan --table-name world_template_catalog --region ${{ env.AWS_REGION }} --max-items 10 >> $GITHUB_STEP_SUMMARY 2>&1 || echo "Empty or cannot scan" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Tail Simulation Pod Logs
        run: |
          echo "### :scroll: Simulation Burn-in Logs (all pods)" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          for pod in $(kubectl get pods -n worldgen -l app=worldgen-stage1 -o jsonpath='{.items[*].metadata.name}'); do
            echo "==========================================" >> $GITHUB_STEP_SUMMARY
            echo "POD: $pod" >> $GITHUB_STEP_SUMMARY
            echo "==========================================" >> $GITHUB_STEP_SUMMARY
            kubectl logs -n worldgen "$pod" --tail=60 >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo "--- (Previous container instance if crashed/restarted) ---" >> $GITHUB_STEP_SUMMARY
            kubectl logs -n worldgen "$pod" --previous --tail=30 >> $GITHUB_STEP_SUMMARY 2>&1 || true
            echo "" >> $GITHUB_STEP_SUMMARY
          done
          echo '```' >> $GITHUB_STEP_SUMMARY
