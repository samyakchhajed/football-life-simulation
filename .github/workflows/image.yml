# Worker image: build and push to ECR
# Tags with both commit SHA and latest for traceability.

name: "Image — Build & Push"

on:
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'football-life-worker' }}

jobs:
  build-and-push:
    name: "Build & Push Worker Image"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG_SHA: sha-${{ github.sha }}
          IMAGE_TAG_LATEST: latest
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPOSITORY}"
          docker build -t "${IMAGE_URI}:${IMAGE_TAG_SHA}" -t "${IMAGE_URI}:${IMAGE_TAG_LATEST}" -f worker/Dockerfile .
          docker push "${IMAGE_URI}:${IMAGE_TAG_SHA}"
          docker push "${IMAGE_URI}:${IMAGE_TAG_LATEST}"
          echo "### :whale: Image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE_URI}:${IMAGE_TAG_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${IMAGE_URI}:${IMAGE_TAG_LATEST}\`" >> "$GITHUB_STEP_SUMMARY"
