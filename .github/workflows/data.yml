# Layer 2: Persistent Data (S3, DynamoDB, ECR)
# Apply only — no destroy path. Worlds are never deleted.

name: "Data — Apply"

on:
  workflow_dispatch: {}

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_ROOT: terraform/data
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'football-life-tfstate-ap-south-1' }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || 'football-life-tfstate-locks' }}

jobs:
  data:
    name: "Apply Persistent Data Layer"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=data/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Format Check
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Idempotent Adoption of Existing Resources
        working-directory: ${{ env.TF_ROOT }}
        run: |
          TEMPLATES_BUCKET="football-life-templates-${{ env.AWS_REGION }}"
          echo "Checking if S3 templates bucket '$TEMPLATES_BUCKET' already exists..."
          if aws s3api head-bucket --bucket "$TEMPLATES_BUCKET" 2>/dev/null; then
            echo "Adopting existing S3 templates bucket..."
            terraform import aws_s3_bucket.world_templates "$TEMPLATES_BUCKET" || true
            terraform import aws_s3_bucket_public_access_block.world_templates "$TEMPLATES_BUCKET" || true
            terraform import aws_s3_bucket_versioning.world_templates "$TEMPLATES_BUCKET" || true
            terraform import aws_s3_bucket_server_side_encryption_configuration.world_templates "$TEMPLATES_BUCKET" || true
          fi

          echo "Checking if DynamoDB catalog table exists..."
          if aws dynamodb describe-table --table-name "world_template_catalog" --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "Adopting existing DynamoDB catalog table..."
            terraform import aws_dynamodb_table.template_catalog "world_template_catalog" || true
          fi

          echo "Checking if ECR repository exists..."
          if aws ecr describe-repositories --repository-names "football-life-worker" --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "Adopting existing ECR repository..."
            terraform import aws_ecr_repository.worker "football-life-worker" || true
          fi

          echo "Checking if Secrets Manager secret exists..."
          if aws secretsmanager describe-secret --secret-id "football-life/ecr-image-url" --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "Adopting existing Secrets Manager secret..."
            terraform import aws_secretsmanager_secret.ecr_image_url "football-life/ecr-image-url" || true
          fi

      - name: Terraform Apply
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -auto-approve -input=false
