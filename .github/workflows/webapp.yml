# Layer 4: Web App Stack (Lambda + S3 frontend)
# Input: apply or destroy. Destroy requires typed confirmation.

name: "Web App — Apply / Destroy"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options:
          - apply
          - destroy
      confirm_destroy:
        description: "Type DESTROY to confirm teardown (required for destroy only)"
        required: false
        type: string
        default: ""

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_ROOT: terraform/webapp
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'football-life-tfstate-ap-south-1' }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || 'football-life-tfstate-locks' }}

jobs:
  webapp:
    name: "Terraform ${{ inputs.action }}"
    runs-on: ubuntu-latest
    steps:
      - name: Validate destroy confirmation
        if: inputs.action == 'destroy' && inputs.confirm_destroy != 'DESTROY'
        run: |
          echo "::error::Destroy requires typing DESTROY in the confirm_destroy input."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Python
        if: inputs.action == 'apply'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package Lambda Application
        if: inputs.action == 'apply'
        run: python scripts/package_lambda.py

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=webapp/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Validate
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Idempotent Adoption of Existing Resources
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: |
          FRONTEND_BUCKET="football-life-frontend-${{ env.AWS_REGION }}"
          echo "Checking if S3 frontend bucket '$FRONTEND_BUCKET' already exists..."
          if aws s3api head-bucket --bucket "$FRONTEND_BUCKET" 2>/dev/null; then
            echo "Adopting existing S3 frontend bucket..."
            terraform import aws_s3_bucket.frontend "$FRONTEND_BUCKET" || true
            terraform import aws_s3_bucket_website_configuration.frontend "$FRONTEND_BUCKET" || true
            terraform import aws_s3_bucket_public_access_block.frontend "$FRONTEND_BUCKET" || true
            terraform import aws_s3_bucket_policy.frontend_public_read "$FRONTEND_BUCKET" || true
          fi

          echo "Checking if Lambda function exists..."
          if aws lambda get-function --function-name "football-life-api-prod" --region "${{ env.AWS_REGION }}" 2>/dev/null; then
            echo "Adopting existing Lambda function..."
            terraform import aws_lambda_function.api "football-life-api-prod" || true
            terraform import aws_lambda_function_url.api_url "football-life-api-prod" || true
          fi

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -auto-approve -input=false

      - name: Deploy Frontend to S3
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: |
          API_URL=$(terraform output -raw api_endpoint_url)
          FRONTEND_BUCKET=$(terraform output -raw frontend_bucket_name)
          WEBSITE_URL=$(terraform output -raw website_endpoint)

          echo "Injecting API URL into frontend/config.js: ${API_URL}"
          echo "window.__API_BASE__ = '${API_URL}';" > ../../frontend/config.js

          echo "Syncing frontend assets to s3://${FRONTEND_BUCKET}/"
          aws s3 sync ../../frontend/ "s3://${FRONTEND_BUCKET}/" --delete

          echo "### :rocket: Web App Deployed Successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Website URL:** [http://${WEBSITE_URL}](http://${WEBSITE_URL})" >> "$GITHUB_STEP_SUMMARY"
          echo "- **API Function URL:** \`${API_URL}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform destroy -auto-approve -input=false

