# Layer 3: EKS Stack (VPC, cluster, node groups, access entry, monitoring)
# Input: apply or destroy. Destroy requires typed confirmation.

name: "EKS — Apply / Destroy"

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Terraform action to perform"
        required: true
        type: choice
        options:
          - apply
          - destroy
      confirm_destroy:
        description: "Type DESTROY to confirm teardown (required for destroy only)"
        required: false
        type: string
        default: ""

permissions:
  id-token: write   # OIDC
  contents: read

env:
  AWS_REGION: ap-south-1
  TF_ROOT: terraform/eks
  TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'football-life-tfstate-ap-south-1' }}
  TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE || 'football-life-tfstate-locks' }}

jobs:
  eks:
    name: "Terraform ${{ inputs.action }}"
    runs-on: ubuntu-latest
    steps:
      - name: Validate destroy confirmation
        if: inputs.action == 'destroy' && inputs.confirm_destroy != 'DESTROY'
        run: |
          echo "::error::Destroy requires typing DESTROY in the confirm_destroy input."
          exit 1

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        run: |
          terraform init \
            -backend-config="bucket=${{ env.TF_STATE_BUCKET }}" \
            -backend-config="key=eks/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ env.TF_LOCK_TABLE }}"

      - name: Terraform Format Check
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform validate

      - name: Terraform Apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform apply -auto-approve -input=false -var="owner_iam_user_arn=${{ secrets.OWNER_IAM_USER_ARN || '' }}"

      - name: Cleanup Kubernetes Load Balancers (Pre-Destroy)
        if: inputs.action == 'destroy'
        run: |
          echo "Checking if EKS cluster is accessible for pre-destroy NLB cleanup..."
          if aws eks describe-cluster --name football-life-eks --region ${{ env.AWS_REGION }} 2>/dev/null; then
            echo "Configuring kubeconfig to drain external LoadBalancers..."
            aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name football-life-eks || true
            kubectl delete svc --all -n worldgen --timeout=60s || true
            echo "Waiting 30s for AWS Network Load Balancer ENIs to detach from VPC subnets..."
            sleep 30
          fi

      - name: Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_ROOT }}
        run: terraform destroy -auto-approve -input=false -var="owner_iam_user_arn=${{ secrets.OWNER_IAM_USER_ARN || '' }}"
